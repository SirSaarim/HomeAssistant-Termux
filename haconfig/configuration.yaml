# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder.
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logbook:
  exclude:
    entities:
      - sensor.next_adhan_in

command_line:
  - sensor:
      name: "HA Watchdog Log"
      command: "tac /config/ha-watchdog.log | head -3 | tr '\n' ' ' | cut -c1-250"
      scan_interval: 300

  - sensor:
      name: "Device Uptime"
      command: "grep '^device_uptime=' /config/ha-status.txt | cut -d'=' -f2-"
      scan_interval: 300

  - sensor:
      name: "SSHD Status"
      command: "grep -E '^sshd_' /config/ha-status.txt | sed 's/^sshd_//' | tr '\\n' ' '"
      scan_interval: 300

  - sensor:
      name: "HA Process Status"
      command: "grep -E '^ha_' /config/ha-status.txt | sed 's/^ha_//' | tr '\\n' ' '"
      scan_interval: 300

  - sensor:
      name: "Watchdog Status"
      command: "grep -E '^watchdog_' /config/ha-status.txt | sed 's/^watchdog_//' | tr '\\n' ' '"
      scan_interval: 300

  - sensor:
      name: "Last Updated"
      command: "grep '^last_updated=' /config/ha-status.txt | cut -d'=' -f2-"
      scan_interval: 300
