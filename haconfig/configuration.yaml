# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder.
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logbook:
  exclude:
    entities:
      - sensor.next_adhan_in

rest:
  - sensor:
      name: "Adhan Config"
      resource: "https://pub-bf016cdd543b4f1b8b3fc2ec4c79d3f3.r2.dev/ha-adhan-config.json"
      scan_interval: 3600
      value_template: "ok"
      json_attributes:
        - fajr
        - dhuhr
        - asr
        - maghrib
        - isha
