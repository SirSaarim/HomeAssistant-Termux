- id: '1790415491873'
  alias: Adhan on Tv
  description: "Plays the appropriate Adhan on the TV at Fajr, Dhuhr, Asr, Maghrib
    and Isha prayer times. Turns on the TV, sets the volume, casts prayer-specific
    audio and artwork from Cloudflare R2 (adhan-media bucket). Audio and image URLs
    are managed via input_text helpers per prayer. \n"
  triggers:
  - trigger: time
    at: sensor.islamic_prayer_times_fajr_prayer
    id: fajr
  - trigger: time
    at: sensor.islamic_prayer_times_dhuhr_prayer
    id: dhuhr
  - trigger: time
    at: sensor.islamic_prayer_times_asr_prayer
    id: asr
  - trigger: time
    at: sensor.islamic_prayer_times_maghrib_prayer
    id: maghrib
  - trigger: time
    at: sensor.islamic_prayer_times_isha_prayer
    id: isha
  - trigger: state
    entity_id: input_boolean.demo_played
    to: 'on'
    id: demo
  conditions: []
  actions:
  - action: media_player.volume_set
    target:
      entity_id: media_player.samina_lakeview_tv
    data:
      volume_level: 0.35
  - action: media_player.turn_on
    target:
      entity_id: media_player.samina_lakeview_tv
    data: {}
  - action: media_player.play_media
    target:
      entity_id: media_player.samina_lakeview_tv
    data:
      media_content_type: audio/mp3
      media_content_id: '{{ states(current.audio) }}'
      extra:
        thumb: '{{ states(current.image) }}'
        current_time: 0
        stream_type: LIVE
        metadata:
          metadataType: 3
          title: '{{ current.name }} Adhan'
          artist: Sir.Saarim for SFam+ | Vol restoring to {{ ((previous_volume | float(0.1))
            * 100) | int }}% after Adhan
          albumName: '{{ now().strftime(''%I:%M %p - %a, %d %b %Y'') }}'
          images:
          - url: '{{ states(current.image) }}'
  - wait_for_trigger:
    - trigger: state
      entity_id: media_player.samina_lakeview_tv
      from: playing
      to: idle
    timeout: 00:10:00
    continue_on_timeout: true
  - action: media_player.volume_set
    target:
      entity_id: media_player.samina_lakeview_tv
    data:
      volume_level: '{{ previous_volume }}'
  - action: input_boolean.turn_on
    target:
      entity_id: '{{ ''input_boolean.'' + (trigger.id | default(''demo'')) + ''_played''
        }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.demo_played
    data: {}
  variables:
    prayer_map:
      fajr:
        name: Fajr
        audio: input_text.fajr_adhan_audio_link
        image: input_text.fajr_adhan_image_link
      dhuhr:
        name: Dhuhr
        audio: input_text.dhuhr_adhan_audio_link
        image: input_text.dhuhr_adhan_image_link
      asr:
        name: Asr
        audio: input_text.asr_adhan_audio_link
        image: input_text.asr_adhan_image_link
      maghrib:
        name: Maghrib
        audio: input_text.maghrib_adhan_audio_link
        image: input_text.maghrib_adhan_image_link
      isha:
        name: Isha
        audio: input_text.isha_adhan_audio_link
        image: input_text.isha_adhan_image_link
      demo:
        name: Demo
        audio: input_text.demo_adhan_audio_link
        image: input_text.demo_adhan_image_link
    current: "{% set prayer = states('input_select.demo_adhan') %} {% if trigger.id
      == 'demo' %}\n  {% if states('input_select.demo_mode') == 'real' %}\n    {{
      prayer_map[prayer] }}\n  {% else %}\n    {{ prayer_map['demo'] }}\n  {% endif
      %}\n{% else %}\n  {{ prayer_map[trigger.id] }}\n{% endif %}\n"
    previous_volume: '{{ state_attr(''media_player.samina_lakeview_tv'', ''volume_level'')
      | float(0.1) }}'
  mode: restart
- id: '1790429316109'
  alias: 'Reboot @ 2 AM '
  description: ''
  triggers:
  - trigger: time
    at: 02:00:00
  conditions: []
  actions:
  - action: androidtv.adb_command
    metadata: {}
    data:
      command: reboot
    target:
      entity_id: media_player.android_tv_192_168_6_88
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - action: androidtv.adb_command
    metadata: {}
    data:
      command: SLEEP
    target:
      entity_id: media_player.android_tv_192_168_6_88
  mode: single
- id: '1790772106574'
  alias: Reset Adhan Status
  description: Resets all prayer played booleans at midnight
  triggers:
  - trigger: time
    at: 00:00:00
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.fajr_played
      - input_boolean.dhuhr_played
      - input_boolean.asr_played
      - input_boolean.maghrib_played
      - input_boolean.isha_played
    data: {}
  mode: single
